apiVersion: v1
kind: Pod
metadata:
  name: terminal-runner
  namespace: default
  labels:
    app.kubernetes.io/name: terminal-runner
spec:
  serviceAccountName: student-sa
  automountServiceAccountToken: true
  containers:
    - name: shell
      image: alpine/k8s:1.29.2
      command: ["sh", "-c", "sleep 86400"]
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        capabilities:
          drop:
            - ALL
