apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: student-isolation-policy
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic originating strictly from the same student namespace
    - from:
        - podSelector: {}
  egress:
    # Allow DNS resolution via CoreDNS in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to pods inside the student's own namespace
    - to:
        - podSelector: {}
